function witness(){const p=c().suspects.find(p=>p.id===person),G=g(),found=G.found.includes('talk-'+p.id);return `<section class="witness-detail"><button class="smallbtn" data-act="return">← ადგილი</button><div class="witness-intro" style="margin-top:22px">${avatar(p)}<div><h2>${p.name}</h2><span class="muted">${p.role}</span></div></div><span class="kicker">პირველი განცხადება</span><div class="quote">„${p.line}“</div>${found?`<div class="recorded"><span class="kicker">დაზუსტებული ჩვენება ✓</span><p>${p.detail}</p></div><button class="primary" style="margin-top:20px" data-act="return">გამოძიებაში დაბრუნება</button>`:`<p class="muted">დამატებითი კითხვა ახალ ინფორმაციას მოგცემს და ერთ სვლას დახარჯავს.</p><button class="primary" style="margin-top:20px" data-act="question" data-id="${p.id}" ${G.left===0?'disabled':''}>მეტი მითხარი · 1 სვლა</button>`}</section>`;}
function result(){const C=c(),G=g(),R=G.result,next=D.cases[(D.cases.findIndex(x=>x.id===C.id)+1)%D.cases.length];return `<section class="result"><div class="result-icon">${R.solved?'✓':R.who?'?':'×'}</div><span class="kicker">${C.name}</span><h1>${R.solved?'საქმე გახსნილია':R.who?'კარგი ეჭვი. სუსტი დასაბუთება.':'ვერსია არ დადასტურდა'}</h1><div class="stars">${'★'.repeat(R.stars)+'☆'.repeat(3-R.stars)}</div><p class="result-score">${R.score} / 100 · გამოყენებული მინიშნებები: ${G.hint}</p><div class="checks"><div><b>${R.who?'✓':'×'}</b>ადამიანი</div><div><b>${R.how?'✓':'×'}</b>მოქმედება</div><div><b>${R.linked?'✓':'×'}</b>მტკიცებულება</div></div><div class="report"><h2>რა მოხდა სინამდვილეში?</h2><p>${C.reveal}</p><h3>შენი დასკვნა</h3><p>${C.suspects.find(p=>p.id===G.accused).name} · ${C.methods[G.method]}</p><p>${R.who?'დამნაშავე სწორად ამოიცანი.':'არჩეული ადამიანის წინააღმდეგ საქმე არ დასტურდება.'} ${R.how?'მოქმედების გზა სწორია.':'არჩეული მოქმედების გზა კვალს არ ემთხვევა.'} ${R.linked?'ორი კვალი ერთად ქმნის გამყარებულ დასაბუთებას.':'არჩეული ორი კვალი საკმარისად არ აკავშირებს დამნაშავეს მოქმედებასთან. დრო, წვდომა და გადამოწმებული ჩვენება უნდა შეაჯერო.'}</p><h3>გამყარებული კავშირი</h3><p>${C.pairs.map(pair=>pair.map(id=>item(id).name).join(' + ')).join(' ან ')}</p></div><div class="result-actions"><button class="primary" data-act="start" data-id="${next.id}">შემდეგი საქმე →</button><button class="smallbtn" data-act="replay">თავიდან გამოძიება</button><button class="smallbtn" data-act="home">ყველა საქმე</button></div></section>`;}
function packs(){return `<section class="packs"><span class="kicker">ახალი საიდუმლოებები</span><h1>სამი ღამის პაკეტი</h1><p class="muted">ამ ვერსიაში ყველა 50 საქმე სრულად ხელმისაწვდომია და უფასოა. შეთავაზებული ფასები მხოლოდ პროდუქტის კონცეფციაა; გადახდა არ ხდება.</p><div class="pack"><span class="kicker">ახლავე ითამაშე</span><h3>ნომერი 307 · დუმილის 40 წამი · ზედმეტად ახალი ნახატი</h3><p>სამი ადგილი, ცხრა ჩვენება და თვრამეტი კვალი.</p><button class="primary" data-act="home">საქმის არჩევა →</button></div><div class="pack"><span class="kicker">სეზონის კონცეფცია · ჯერ არ არის შექმნილი</span><h3>„ქალაქი, რომელიც იტყუება“</h3><p>ათი ახალი საქმე და საერთო საიდუმლო, რომელსაც ბოლო ეპიზოდში გახსნი.</p><span class="price">სატესტო ფასი: 12–19 ₾</span></div><div class="pack"><span class="kicker">ორი სეზონის კონცეფცია</span><h3>„ორმაგი ზარი“</h3><p>ორი დამოუკიდებელი სეზონი ერთ ნაკრებში. ღირებულება ახალი ისტორიები და თავსატეხებია.</p><span class="price">სატესტო ფასი: 22–29 ₾</span></div><p class="footer">გაყიდვაში გასვლამდე საჭიროა ახალი საქმეების შექმნა, მოთამაშეებთან გამოცდა და მაღაზიის შესყიდვის ფუნქცია.</p></section>`;}
function render(){const html=view==='home'?home():view==='packs'?packs():view==='person'?witness():g()?.result?result():investigation();$('#app').innerHTML=header()+`<main>${html}${!storage?'<p class="footer">ამ ბრაუზერში პროგრესის მუდმივი შენახვა მიუწვდომელია.</p>':''}</main>`;}
function close(){document.body.classList.remove('dialog-open');$('#overlay').innerHTML='';if(previousFocus?.isConnected)previousFocus.focus();}
function dialog(kicker,title,text,actions='<button class="primary" data-act="close">გასაგებია</button>'){previousFocus=document.activeElement;document.body.classList.add('dialog-open');$('#overlay').innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><div class="dialog-head"><span class="kicker">${kicker}</span><button data-act="close" aria-label="დახურვა">×</button></div><h2 id="dialog-title">${title}</h2><p>${text}</p>${actions}</section></div>`;$('.dialog').focus();}
function read(id){const x=item(id);dialog(x.kind,x.name,x.text);}
function start(id,fresh=false){profile.active=id;if(fresh||!profile.games[id])profile.games[id]=E.fresh(id);view='game';tab='scene';person=null;save();render();window.scrollTo(0,0);}
document.addEventListener('click',event=>{const el=event.target.closest('[data-act]');if(!el||el.disabled)return;const act=el.dataset.act,id=el.dataset.id;try{switch(act){case'theme':theme=theme==='dark'?'light':'dark';try{localStorage.setItem('last-call-theme',theme);}catch{}applyTheme();render();document.querySelector('[data-act=theme]')?.focus({preventScroll:true});break;case'home':close();view='home';render();window.scrollTo(0,0);break;case'start':start(id);break;case'packs':view='packs';render();window.scrollTo(0,0);break;case'tab':view='game';tab=id;render();window.scrollTo(0,0);break;case'clue':if(!g().found.includes(id)){profile.games[profile.active]=E.discover(g(),id);save();beep();render();}read(id);break;case'read':read(id);break;case'person':person=id;view='person';render();window.scrollTo(0,0);break;case'return':view='game';tab='scene';render();break;case'question':profile.games[profile.active]=E.discover(g(),'talk-'+id);save();beep();render();break;case'accuse':g().accused=id;save();render();break;case'method':g().method=Number(id);save();render();break;case'proof':if(g().proof.includes(id))g().proof=g().proof.filter(x=>x!==id);else if(g().proof.length<2)g().proof.push(id);else{toast('ორი კვალი უკვე არჩეულია. ერთს შეეხე მოსახსნელად.');break;}save();render();break;case'confirm':dialog('ბოლო ნაბიჯი','ამ ვერსიას ადასტურებ?',`${c().suspects.find(p=>p.id===g().accused).name} · ${c().methods[g().method]}. ამის შემდეგ საქმის სრული პასუხი გამოჩნდება.`,`<button class="primary" data-act="finish">დიახ, წარვადგინო დასკვნა</button><button class="smallbtn" style="width:100%;margin-top:12px" data-act="close">ჯერ გადავამოწმებ</button>`);break;case'finish':profile.games[profile.active]=E.conclude(g());if(!profile.best[g().id]||profile.best[g().id].score<g().result.score)profile.best[g().id]={score:g().result.score,stars:g().result.stars};save();close();render();window.scrollTo(0,0);break;case'replay':dialog('ახალი მცდელობა','საქმეს თავიდან დაიწყებ?','ამ საქმის შეგროვებული კვალი გასუფთავდება. საუკეთესო შედეგი შენარჩუნდება.','<button class="primary" data-act="restart">თავიდან დაწყება</button>');break;case'restart':close();start(profile.active,true);break;case'hint':if(g().hint>=3){toast('სამივე მინიშნება გამოყენებულია.');break;}dialog('სურვილისამებრ · −5 ქულა','მინიშნება გჭირდება?','მინიშნება საგამოძიებო სვლას არ ხარჯავს. თითო მინიშნება საბოლოო ქულას 5-ით ამცირებს.','<button class="primary" data-act="takehint">მინიშნების გახსნა</button>');break;case'takehint':{if(g().hint>=3)break;g().hint++;save();const texts=['ალიბი და მოტივი საკმარისი არ არის. მოძებნე მოქმედების ზუსტი დრო და ვის ჰქონდა წვდომა.',`მნიშვნელოვან ინფორმაციას შეიცავს „${c().clues[0].name}“. შეადარე შესაბამის ჩვენებას ან მეორე კვალს.`,`სცადე ეს ორი კვალი ერთად შეაფასო: ${c().pairs[0].map(id=>item(id).name).join(' + ')}.`];dialog('მინიშნება '+g().hint,'დასკვნა შენ გამოიტანე',texts[g().hint-1]);break;}case'help':dialog('როგორ ითამაშო','კვალი → ჩვენება → დასკვნა','ნივთის დათვალიერება ან დამატებითი კითხვა ერთ სვლას ხარჯავს. სულ ექვსი სვლა გაქვს. წაკითხული კვალის ხელახლა გახსნა უფასოა. ბოლოს აირჩიე ადამიანი, მოქმედების გზა და ორი შეგროვებული მტკიცებულება. დრო რეალურად არ ითვლება — თამაში შეგიძლია ნებისმიერ დროს შეაჩერო.');break;case'close':close();break;}}catch(e){toast(e.message);}});
document.addEventListener('keydown',event=>{if(!$('.dialog'))return;if(event.key==='Escape')close();if(event.key==='Tab'){const elements=[...$('.dialog').querySelectorAll('button:not(:disabled),a')],first=elements[0],last=elements.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('.dialog'))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
window.labBack=()=>{if($('.dialog')){close();return true;}if(view==='person'){view='game';render();return true;}if(view!=='home'){view='home';render();return true;}return false;};window.LastCall={getState:()=>E.clone({profile,view,tab}),getCase:c};render();})();
</script></body></html>
